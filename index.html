<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>風来斬3D オンライン</title>
<style>
html,body{margin:0;height:100%;background:#0d0d0d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;touch-action:none}
#lobby{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,10,10,.82);z-index:5;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;color:#eee}
#lobbyBody{max-width:560px;width:90%;text-align:center;padding:28px;border:1px solid #444;background:#151515;border-radius:12px;user-select:text;-webkit-user-select:text}
#lobby h1{font-size:52px;margin:6px 0 4px;letter-spacing:.08em}#lobby h1 span{color:#d8363a}
#lobby p{margin:12px 0;line-height:1.7}#lobby .big{font-size:20px}#lobby .dim{color:#aaa}#lobby .small{font-size:13px}
#lobby button{font:inherit;font-size:20px;font-weight:700;padding:12px 28px;margin:10px 4px;border:0;border-radius:8px;background:#d8363a;color:#fff;cursor:pointer}
#lobby .row{display:flex;gap:6px}#lobby input{flex:1;font-size:14px;padding:10px;border-radius:6px;border:1px solid #555;background:#000;color:#fff;min-width:0}
#lobby .row button{font-size:15px;padding:10px 14px;margin:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lobby"><div id="lobbyBody"></div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>if(typeof Peer==='undefined')document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif';
let W,H,DPR,GW,GH,OX,HW,HH,FH,GY,sc,R,LX,LY,AX;

// ===== 定数 =====
const PINCH=4.0,RUSH_PICK=700,RUSH_WIN0=1300,RUSH_MIN=320,RUSH_SHRINK=0.85,RUSH_GOAL=10; // 10合守りきれば防御側の勝ち // 防御された後のピンチ時間(秒)
const D0=330,REACH=205,KICK_R=74,MIN_D=50,MAX_D=620,SPEED=130,BACK_SPEED=100,POT0=20,POT_ADD=6,POT_MAX=80,WIND=600,REC=340,HIT=20,KICK=6;
const TEMAE=-1,OKU=1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const hash=(n,s)=>{const x=Math.sin(n*127.1+s*311.7)*43758.5453;return x-Math.floor(x)};

let P,mode,modeT,rush,camMid,shake,hitStop,slow,parts,koWinner,T=0;
function mkP(i){return{i,kickA:0,newSword:0,x:i?D0/2:-D0/2,hp:100,hpG:100,lever:0,lastDir:TEMAE,lean:0,leanV:0,state:'idle',st:0,dir:TEMAE,
  dur:100,broken:false,pinch:0,kbT:0,kbv:0,lunge:0,walk:0,moving:0,swingT:9,swingDir:TEMAE,ready:false,btnFlash:0,hurtDur:400,kdone:false}}
function reset(){P=[mkP(0),mkP(1)];mode='title';modeT=0;rush=null;camMid=0;shake=0;hitStop=0;slow=0;parts=[];koWinner=null}
reset();
const canKick=p=>mode==='fight'&&(p.state==='kick'||dist()<KICK_R);
const fwd=p=>p.i===0?1:-1,other=p=>P[1-p.i],dist=()=>P[1].x-P[0].x;
function curDir(p){return p.lever<-0.15?TEMAE:p.lever>0.15?OKU:p.lastDir}

// ===== 音 =====
let AC=null,NB=null;
function initAudio(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const len=AC.sampleRate*0.6|0;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}if(AC.state==='suspended')AC.resume();bgmInit()}catch(e){}}
function env(g,t,a,pk,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dec)}
function noise(t,dur,type,freq,q,pk){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();env(g,t,0.003,pk,dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur+0.05);return f}
const sfx={
  clang(p=1){if(!AC)return;const t=AC.currentTime,b=1350*p*(0.96+Math.random()*0.08);
    [1,1.51,2.13,2.92,3.73].forEach((m,i)=>{const o=AC.createOscillator();o.type=i?'sine':'triangle';o.frequency.value=b*m;const g=AC.createGain();env(g,t,0.002,0.2/(i+1),0.3+0.3/(i+1));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.75)});
    noise(t,0.05,'highpass',3000,0.7,0.35)},
  hit(){this.zubishi(0)},
  swish(v=0.5){if(!AC)return;const t=AC.currentTime,f=noise(t,0.2,'bandpass',800,1.3,0.3*v);f.frequency.setValueAtTime(600,t);f.frequency.exponentialRampToValueAtTime(3600,t+0.18)},
  brk(){if(!AC)return;this.clang(0.62);noise(AC.currentTime,0.45,'highpass',1800,0.5,0.35)},
  miss(){if(!AC)return;const t=AC.currentTime;const o=AC.createOscillator();o.type='square';o.frequency.value=900;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1300;f.Q.value=5;const g=AC.createGain();env(g,t,0.001,0.35,0.09);o.connect(f);f.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.12);
    const b=AC.createOscillator();b.type='sine';b.frequency.setValueAtTime(70,t);b.frequency.exponentialRampToValueAtTime(40,t+0.6);const bg=AC.createGain();env(bg,t,0.01,0.55,0.7);b.connect(bg);bg.connect(AC.destination);b.start(t);b.stop(t+0.75)},
  slowIn(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(70,t+0.55);
    const g=AC.createGain();env(g,t,0.01,0.4,0.65);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.7);
    const f=noise(t,0.6,'bandpass',3000,1.5,0.25);f.frequency.setValueAtTime(4000,t);f.frequency.exponentialRampToValueAtTime(300,t+0.55);
    const h=AC.createOscillator();h.type='sine';h.frequency.value=55;const hg=AC.createGain();env(hg,t+0.05,0.01,0.6,0.35);h.connect(hg);hg.connect(AC.destination);h.start(t+0.05);h.stop(t+0.45)},
  zuba(k=1){this.zubishi(k)},
  // ズビシィ！: ズ(歪んだ低い唸り)→ビ(高速の風切り)→シィ(鋭い破裂と擦れる余韻)
  zubishi(k=0){if(!AC)return;const t=AC.currentTime,pv=1+((k%3)-1)*0.06;
    if(!this._ws){const ws=AC.createWaveShaper(),c=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;c[i]=Math.tanh(x*6)}ws.curve=c;this._ws=ws;const g=AC.createGain();g.gain.value=0.5;ws.connect(g);g.connect(AC.destination)}
    const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(160*pv,t);o.frequency.exponentialRampToValueAtTime(70,t+0.06);
    const og=AC.createGain();env(og,t,0.002,0.5,0.07);o.connect(og);og.connect(this._ws);o.start(t);o.stop(t+0.1);
    const b=noise(t+0.015,0.07,'bandpass',7000*pv,1.8,0.7);b.frequency.setValueAtTime(7500*pv,t+0.015);b.frequency.exponentialRampToValueAtTime(1600,t+0.08);
    const s1=AC.createBufferSource();s1.buffer=NB;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=2400;const sg=AC.createGain();
    sg.gain.setValueAtTime(0.0001,t+0.05);sg.gain.exponentialRampToValueAtTime(0.85,t+0.056);sg.gain.exponentialRampToValueAtTime(0.25,t+0.1);sg.gain.exponentialRampToValueAtTime(0.0001,t+0.42);
    s1.connect(hp);hp.connect(sg);sg.connect(this._ws);s1.start(t+0.05,Math.random()*0.2);s1.stop(t+0.45);
    const c2=AC.createOscillator();c2.type='square';c2.frequency.setValueAtTime(2400*pv,t+0.05);c2.frequency.exponentialRampToValueAtTime(900,t+0.12);
    const cg=AC.createGain();env(cg,t+0.05,0.001,0.12,0.1);c2.connect(cg);cg.connect(AC.destination);c2.start(t+0.05);c2.stop(t+0.16);
    const th=AC.createOscillator();th.type='sine';th.frequency.setValueAtTime(130,t+0.05);th.frequency.exponentialRampToValueAtTime(45,t+0.25);const tg=AC.createGain();env(tg,t+0.05,0.003,0.45,0.28);th.connect(tg);tg.connect(AC.destination);th.start(t+0.05);th.stop(t+0.32)},
  boom(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(35,t+0.6);const g=AC.createGain();env(g,t,0.01,0.6,0.7);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.8);this.swish(0.9)}
};
// ===== BGM (WebAudioで和風に生成) =====
const BGM={track:'none',next:0,step:0,bus:null,out:null,phrase:0};
const SCALE=[0,1,5,7,8,12,13,17,19,20,24,25,29]; // 都節音階
const nf=(i,base=146.83)=>base*Math.pow(2,SCALE[clamp(i,0,SCALE.length-1)]/12);
function bgmInit(){if(!AC||BGM.out)return;
  BGM.out=AC.createGain();BGM.out.gain.value=0.38;BGM.out.connect(AC.destination);
  BGM.bus=AC.createGain();BGM.bus.connect(BGM.out);
  const d=AC.createDelay(1);d.delayTime.value=0.31;const fb=AC.createGain();fb.gain.value=0.33;const wet=AC.createGain();wet.gain.value=0.28;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
  BGM.bus.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(wet);wet.connect(BGM.out);
  setInterval(bgmTick,40)}
function bNoise(t,dur,type,freq,q,pk){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();env(g,t,0.004,pk,dur);s.connect(f);f.connect(g);g.connect(BGM.bus);s.start(t);s.stop(t+dur+0.05)}
function taiko(t,v,pt=1){const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(120*pt,t);o.frequency.exponentialRampToValueAtTime(48*pt,t+0.28);
  const g=AC.createGain();env(g,t,0.005,0.9*v,0.45);o.connect(g);g.connect(BGM.bus);o.start(t);o.stop(t+0.5);bNoise(t,0.08,'lowpass',500,0.7,0.5*v)}
function kan(t,v){const o=AC.createOscillator();o.type='square';o.frequency.value=1100;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1500;f.Q.value=6;
  const g=AC.createGain();env(g,t,0.002,0.25*v,0.07);o.connect(f);f.connect(g);g.connect(BGM.bus);o.start(t);o.stop(t+0.1)}
function shaku(t,fr,dur,v,fall){const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(fr*0.97,t);o.frequency.linearRampToValueAtTime(fr,t+0.12);
  if(fall)o.frequency.linearRampToValueAtTime(fr*0.89,t+dur);
  const lfo=AC.createOscillator();lfo.frequency.value=5.2;const lg=AC.createGain();lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(fr*0.012,t+dur*0.7);lfo.connect(lg);lg.connect(o.frequency);
  const o2=AC.createOscillator();o2.type='triangle';o2.frequency.value=fr*2;const g2=AC.createGain();g2.gain.value=0.12;o2.connect(g2);
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22*v,t+0.14);g.gain.setValueAtTime(0.22*v,t+Math.max(0.15,dur-0.2));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g2.connect(g);g.connect(BGM.bus);[o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+dur+0.05)});
  bNoise(t,Math.min(0.5,dur),'bandpass',fr*3,2,0.05*v)}
function shami(t,fr,v){const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(fr*1.02,t);o.frequency.exponentialRampToValueAtTime(fr,t+0.03);
  const f=AC.createBiquadFilter();f.type='lowpass';f.Q.value=4;f.frequency.setValueAtTime(3200,t);f.frequency.exponentialRampToValueAtTime(500,t+0.25);
  const g=AC.createGain();env(g,t,0.003,0.2*v,0.38);o.connect(f);f.connect(g);g.connect(BGM.bus);o.start(t);o.stop(t+0.42);bNoise(t,0.02,'highpass',2500,0.7,0.12*v)}
// 決闘: ゆったり8分音符、32ステップ
const DUEL_PH=[[[0,7,6,0],[6,8,2,0],[8,5,4,0],[12,4,4,1],[16,7,3,0],[19,8,1,0],[20,9,4,0],[24,8,3,0],[27,7,1,0],[28,5,4,1]],
               [[0,5,3,0],[3,4,1,0],[4,3,4,0],[8,4,2,0],[10,5,2,0],[12,7,8,1],[20,8,2,0],[22,7,2,0],[24,5,3,0],[27,4,1,0],[28,3,4,1]]];
function duelStep(st,t,sp){const i=st%32;
  if(i===0||i===16)taiko(t,0.9);if(i===12||i===28)taiko(t,0.5,1.15);if(i===14||i===30)taiko(t,0.35,1.15);
  if(i===6||i===22)kan(t,0.7);
  if(i===4)shami(t,nf(0,73.4),0.8);if(i===20)shami(t,nf(1,73.4),0.7);
  if(i===0&&st>0)BGM.phrase++;
  if((Math.floor(st/32)%3)!==2)for(const n of DUEL_PH[BGM.phrase%2])if(n[0]===i)shaku(t,nf(n[1]),n[2]*sp*0.98,0.9,n[3])}
// 攻防: 激しい16分音符
const RUSH_TK=[1,0,0,.5,0,0,.8,0,1,0,.5,0,.8,0,.6,.6],RUSH_ARP=[0,2,3,5,4,3,5,7,6,5,7,8,9,8,7,5];
function rushStep(st,t,sp){const i=st%16,bar=Math.floor(st/16);
  if(RUSH_TK[i])taiko(t,RUSH_TK[i],i%4?1.2:1);
  if(i%2===1)kan(t,i%4===3?0.6:0.35);
  const a=RUSH_ARP[(i+bar*3)%16]+(bar%2?1:0);shami(t,nf(a,146.83),i%4===0?1:0.6);
  if(i===0&&bar%2===0)shaku(t,nf(10),sp*14,0.8,1);
  if(i===0&&bar%4===3){taiko(t,1,0.9);}}
function bgmDuck(on){if(!AC||!BGM.out)return;const n=AC.currentTime;BGM.out.gain.cancelScheduledValues(n);BGM.out.gain.setValueAtTime(Math.max(0.0001,BGM.out.gain.value),n);BGM.out.gain.linearRampToValueAtTime(on?0.1:0.42,n+(on?0.12:0.08))}
function bgmWant(){if(mode==='rush'&&rush&&rush.phase!=='stagger'&&rush.phase!=='after')return'rush';if(mode==='ko'||mode==='end')return'none';return'duel'}
function bgmTick(){if(!AC||AC.state!=='running')return;const w=bgmWant(),now=AC.currentTime;
  if(w!==BGM.track){BGM.track=w;BGM.step=0;BGM.next=now+0.06;BGM.phrase=0;
    BGM.out.gain.cancelScheduledValues(now);BGM.out.gain.setValueAtTime(0.0001,now);BGM.out.gain.exponentialRampToValueAtTime(w==='rush'?0.42:0.36,now+0.25)}
  if(w==='none')return;
  if(BGM.next<now-0.3)BGM.next=now+0.05;
  while(BGM.next<now+0.2){let sp;
    if(w==='rush'){const bpm=Math.min(196,152+(rush?rush.n:0)*4);sp=60/bpm/4;rushStep(BGM.step,BGM.next,sp)}
    else{sp=60/72/2;duelStep(BGM.step,BGM.next,sp)}
    BGM.step++;BGM.next+=sp}}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

// ===== 入力 (オンライン版: 自分の侍だけを操作) =====
function act(p){
  if(mode==='title'){if(!p.ready){p.ready=true;sfx.swish(0.3)}if(P[0].ready&&P[1].ready){mode='count';modeT=0}return}
  if(mode==='end'){if(modeT>0.8){reset();P.forEach(q=>q.ready=true);mode='count';modeT=0}return}
  if(mode==='fight'){p.btnFlash=1;if(p.state!=='idle')return;
    if(canKick(p)){p.state='kick';p.st=0;p.kdone=false;sfx.swish(0.4)}
    else{p.state='windup';p.st=0;p.dir=curDir(p);sfx.swish(0.25)}return}
  if(mode==='rush')rushPress(p);
}
let ME=0;            // 自分の侍 (ホスト=0 / ゲスト=1)
let NET=null;        // {role:'host'|'guest', send(obj)}
let localLever=0,touchLever=null,remoteLever=0;
const keys={};
function keyLever(){return (keys.KeyD||keys.ArrowRight?-1:0)+(keys.KeyA||keys.ArrowLeft?1:0)} // 右=前進・手前(内部値-1)
function pressAttack(){initAudio();if(!NET)return;
  if(NET.role==='host')act(P[0]);else NET.send({a:1})}
const ATK_KEYS=['Space','KeyF','KeyJ','Enter','KeyS','ArrowDown','KeyK'];
addEventListener('keydown',e=>{if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  if(['Space','ArrowLeft','ArrowRight','ArrowDown','ArrowUp'].includes(e.code))e.preventDefault();
  if(e.repeat)return;keys[e.code]=true;initAudio();if(ATK_KEYS.includes(e.code))pressAttack()});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
// タッチ/マウス: 画面左半分ドラッグ=レバー、右半分タップ=斬る
const ptr=new Map();
function toView(e){return{x:(e.clientX-VX)/VK,y:(e.clientY-VYo)/VK}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();const L=toView(e);
  if(L.x<HW*0.5){ptr.set(e.pointerId,{role:'lever',sx:L.x});touchLever=0}else{ptr.set(e.pointerId,{role:'atk'});pressAttack()}
  try{cv.setPointerCapture(e.pointerId)}catch(_){}},{passive:false});
cv.addEventListener('pointermove',e=>{const q=ptr.get(e.pointerId);if(!q||q.role!=='lever')return;const L=toView(e);touchLever=clamp(-(L.x-q.sx)/(R*0.9),-1,1)});
function up(e){const q=ptr.get(e.pointerId);if(!q)return;if(q.role==='lever')touchLever=null;ptr.delete(e.pointerId)}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
document.addEventListener('touchmove',e=>{if(e.target===cv)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target===cv)e.preventDefault()});
function readLocalLever(){const k=keyLever();localLever=touchLever!==null?touchLever:k}

// ===== 戦闘ロジック =====
function strike(a){const b=other(a),d=dist();a.lunge=1;a.swingT=0;a.swingDir=a.dir;
  a.recDur=REC;a.whiff=false;
  if(d>REACH){sfx.swish(0.6);a.recDur=REC+650;a.whiff=true;return} // 空振りは長い硬直
  if(b.state==='windup'&&b.dir===a.dir){clash(a,b);return}
  hit(b,HIT,D0,420)}
function hit(b,dmg,toD,hd){
  other(b).pinch=0; // 攻撃を当てればピンチ解除
  b.hp=Math.max(0,b.hp-dmg);b.state='hurt';b.st=0;b.hurtDur=hd;
  const need=toD-dist();if(need>0){b.kbT=0.26;b.kbv=-fwd(b)*need/0.26}
  spawnInk(b);shake=Math.max(shake,11);hitStop=0.09;sfx.hit();buzz(40);
  if(b.hp<=0)ko(other(b))}
function clash(a,b){
  const wasPinch=a.pinch>0;
  a.state='recoil';a.st=0;b.state='recoil';b.st=0;b.swingT=0;b.swingDir=b.dir;
  for(const p of [a,b]){p.kbT=0.14;p.kbv=-fwd(p)*26/0.14}
  spawnSpark((a.x+b.x)/2,112);shake=Math.max(shake,6);hitStop=0.07;sfx.clang(1);buzz(15);
  if(wasPinch)startRush(b,a);else{a.pinch=PINCH;a.pinchHit=1;buzz(60)}}
function kick(a){const b=other(a);if(dist()<KICK_R+16)hit(b,KICK,D0*1.35,320);else sfx.swish(0.4)}
function ko(w){mode='ko';modeT=0;koWinner=w;const l=other(w);l.state='down';l.st=0;slow=1.0;buzz(150);sfx.boom()}

function startRush(atk,def){P.forEach(p=>{p.pinch=0});mode='rush';rush={atk,def,phase:'stagger',t:0,win:RUSH_WIN0,pot:POT0,dir:TEMAE,n:0,hits:0};
  def.state='stagger';def.st=0;atk.state='idle';atk.st=0;P.forEach(p=>{p.kbT=0})}
function rushUpdate(dt){const r=rush;r.t+=dt*1000;
  switch(r.phase){
    case 'stagger':if(r.t>650){r.phase='cutin';r.t=0;sfx.boom()}break;
    case 'cutin':if(r.t>1700){const m=(P[0].x+P[1].x)/2;P[0].x=m-66;P[1].x=m+66;camMid=m;r.phase='atk';r.t=0;r.def.state='rguard';r.atk.state='rready'}break;
    case 'atk':if(r.t>=RUSH_PICK){r.dir=curDir(r.atk);r.atk.dir=r.dir;r.phase='slow';r.t=0;sfx.slowIn();bgmDuck(true);buzz(10)}break;
    case 'slow':if(r.t>=r.win){bgmDuck(false);rushResolve()}break;
    case 'miss':if(r.t>=1300)rushFail();break; // 角度のずれを見せる静止
    case 'gap':if(r.t>200){r.phase='atk';r.t=0}break;
    case 'finish':if(r.t>r.hits*r.iv+350)finisherHit();break;
    case 'after':if(r.t>750)endRush();break;
  }}
function rushPress(p){} // 攻防中はボタン不要
// 締め切りの瞬間の角度で、お互い同時に斬る
function rushResolve(){const r=rush,a=r.dir,d=curDir(r.def);r.ddir=d;r.def.swingDir=d;
  if(a===d){r.n++;r.pot=Math.min(POT_MAX,r.pot+POT_ADD);r.win=Math.max(RUSH_MIN,r.win*RUSH_SHRINK);
    spawnSpark((P[0].x+P[1].x)/2,122);sfx.clang(1+Math.min(0.5,r.n*0.03));shake=Math.max(shake,5);hitStop=0.04;buzz(12);
    if(r.n>=RUSH_GOAL){r.broke=true;sfx.clang(0.8);sfx.boom();shake=14;hitStop=0.3;buzz(120);startCombo(r.def,r.atk)}
    else{r.phase='gap';r.t=0}}
  else{r.phase='miss';r.frozen=true;r.t=0;sfx.miss();shake=8;hitStop=0.06;buzz(90)}}
function rushFail(){startCombo(rush.atk,rush.def)}
// 連撃: 打ち合った合の数だけ斬る(最低1回)。蓄積ダメージを分けて与える
function startCombo(striker,victim){const r=rush;r.striker=striker;r.victim=victim;r.N=Math.max(1,r.n);r.iv=r.N>8?105:150;r.phase='finish';r.t=0;r.hits=0;
  victim.state='hurt';victim.st=0;victim.hurtDur=99999}
function endRush(){mode='fight';modeT=1;P.forEach(p=>{p.pinch=0;if(p.broken){p.broken=false;p.dur=100;p.newSword=1.6}if(p.state!=='hurt'){p.state='idle';p.st=0}});rush=null}
function finisherHit(){const r=rush;r.hits++;const a=r.victim,d=r.striker,N=r.N;
  if(!r.frozen){d.swingT=0;d.swingDir=r.hits%2?TEMAE:OKU;d.lunge=1;a.x+=fwd(d)*6}
  spawnSlash(a);spawnInk(a);sfx.zuba(r.hits);shake=12;hitStop=0.05;buzz(25);
  const dmg=Math.round(r.pot*r.hits/N)-Math.round(r.pot*(r.hits-1)/N);
  a.hp=Math.max(0,a.hp-dmg);a.state='hurt';a.st=0;a.hurtDur=99999;
  if(r.hits>=N&&a.hp<=0){r.frozen=false;ko(d);return}
  if(r.hits>=N){r.frozen=false;r.phase='after';r.t=0;a.hurtDur=650;a.st=0;const need=D0-dist();if(need>0){a.kbT=0.3;a.kbv=-fwd(a)*need/0.3}buzz(40)}}
function fightUpdate(dt){
  for(const p of P){p.moving=0;
    switch(p.state){
      case 'idle':{const o=other(p),frozen=o.state==='windup'||(o.state==='strike'&&o.st<130)||(o.state==='kick'&&o.st<120); // 相手の振り終わり(隙)は動ける
        if(!frozen&&Math.abs(p.lever)>0.12){const v=-p.lever*(p.lever<0?SPEED:BACK_SPEED),nx=p.x+fwd(p)*v*dt,nd=p.i===0?(P[1].x-nx):(nx-P[0].x);
          if(nd<=MAX_D||v>0)p.x=nx;p.moving=v;p.walk+=Math.abs(v)*dt*0.05;}
        break;}
      case 'windup':if(p.st>=WIND){p.state='strike';p.st=0;strike(p)}break;
      case 'strike':if(p.st>=(p.recDur||REC)){p.state='idle';p.st=0;p.whiff=false}break;
      case 'recoil':if(p.st>=REC){p.state='idle';p.st=0}break;
      case 'kick':if(!p.kdone&&p.st>=90){p.kdone=true;kick(p)}if(p.st>=330){p.state='idle';p.st=0}break;
      case 'hurt':if(p.st>=p.hurtDur){p.state='idle';p.st=0}break;
    }}}

function update(dt){
  const sl=(mode==='rush'&&rush)?(rush.phase==='slow'?0.2:(rush.phase==='miss'||rush.frozen)?0:1):1;
  T+=dt*sl;modeT+=dt;updLeaves(dt*sl);
  const rushLive=mode==='rush'&&rush&&rush.phase!=='cutin'&&rush.phase!=='stagger';
  for(const p of P){
    if(Math.abs(p.lever)>0.15)p.lastDir=p.lever<0?TEMAE:OKU;
    let tgt=p.lever!==0?p.lever:p.lastDir*0.3;
    if(p.state==='windup'||p.state==='strike')tgt=p.dir*0.95;
    if(rushLive&&rush.phase==='slow'&&p===rush.atk)tgt=rush.dir*0.95;
    if(rushLive&&(rush.phase==='miss'||rush.frozen))tgt=(p===rush.atk?rush.dir:rush.ddir)*1.0;
    if(rushLive&&rush.phase==='gap')tgt=(p===rush.atk?rush.dir:rush.ddir)*0.95;
    if(p.state==='stagger'||p.state==='down')tgt=0;
    p.leanV+=((tgt-p.lean)*260-p.leanV*14)*dt;p.lean+=p.leanV*dt;
    p.st+=dt*1000;p.swingT+=dt;p.btnFlash=Math.max(0,p.btnFlash-dt*4);p.lunge=Math.max(0,p.lunge-dt*4);
    p.hpG=Math.max(p.hp,p.hpG-dt*25);p.newSword=Math.max(0,p.newSword-dt);p.pinchHit=Math.max(0,(p.pinchHit||0)-dt*2.5);p.kickA=clamp(p.kickA+(canKick(p)?1:-1)*dt*9,0,1);
    if(p.kbT>0){const k=Math.min(dt,p.kbT);p.x+=p.kbv*k;p.kbT-=k}
  }
  if(mode==='count'&&modeT>2.0){mode='fight';modeT=0}
  if(mode==='fight')fightUpdate(dt);
  else if(mode==='rush')rushUpdate(dt);
  else if(mode==='ko'&&modeT>2.2){mode='end';modeT=0}
  const d=dist();if(d<MIN_D){const c=(MIN_D-d)/2;P[0].x-=c;P[1].x+=c}
  camMid+=((P[0].x+P[1].x)/2-camMid)*Math.min(1,dt*5);
  for(const q of parts){q.age+=dt;q.wx+=(q.vx||0)*dt;q.h+=(q.vy||0)*dt;if(q.g)q.vy-=q.g*dt;if(q.va)q.ang+=q.va*dt}
  parts=parts.filter(q=>q.age<q.life);
  shake=Math.max(0,shake-dt*32);
}

function mountain(camX,par,base,amp,color,seed){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-20,FH);

function grass(camX,par,y,spacing,hmin,hmax,color,seed){

// ===== 侍 (簡易3D投影) =====
const CAM_E=0.34,CE=Math.cos(CAM_E),SE=Math.sin(CAM_E),CAM_D=320;
function prj(v){const f=CAM_D/(CAM_D-v[2]);return[v[0]*f,(-v[1]*CE+v[2]*SE)*f,f]}
function rot(p,v){const t=p._tau,ph=p._phi,x1=v[0]*Math.cos(t)+v[1]*Math.sin(t),y1=-v[0]*Math.sin(t)+v[1]*Math.cos(t);
  return[x1,y1*Math.cos(ph)-v[2]*Math.sin(ph),y1*Math.sin(ph)+v[2]*Math.cos(ph)]}
function rotA(v,t,ph){const x1=v[0]*Math.cos(t)+v[1]*Math.sin(t),y1=-v[0]*Math.sin(t)+v[1]*Math.cos(t);return[x1,y1*Math.cos(ph)-v[2]*Math.sin(ph),y1*Math.sin(ph)+v[2]*Math.cos(ph)]}
// 腰の位置は下半身の傾き(足元が支点)に追従する
function bx(p,v){const r=rot(p,v),h=p._hip||[0,74,0];return[r[0]+h[0],r[1]+h[1],r[2]+h[2]]}
function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
  for(const q of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q)}
  for(let i=P.length-1;i>=0;i--){const q=P[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q)}
  up.pop();lo.pop();return lo.concat(up)}
function fillPts(pts3){const h=hull(pts3.map(v=>{const a=prj(v);return[a[0],a[1]]}));ctx.beginPath();h.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill()}
function lineP(a,b,w){const A=prj(a),B=prj(b);ctx.lineWidth=w*(A[2]+B[2])/2;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke()}
function ring(c,y,r,n){const o=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2;o.push([c+r*Math.cos(t),y,r*Math.sin(t)])}return o}

// 刀の姿勢: p=ピッチ(上向き+), y=ヨー(手前+ / 奥-)
function swordPose(p){
  const l=clamp(p.lean,-1.2,1.2),G={p:0.72-Math.abs(l)*0.5,y:-l*0.85},r=rush,L=(a,b,t)=>({p:lerp(a.p,b.p,clamp(t,0,1)),y:lerp(a.y,b.y,clamp(t,0,1))});
  const up=d=>({p:1.95,y:d*0.6}),low=d=>({p:-0.55,y:-d*0.75}),mid={p:0.3,y:0};
  if(p.state==='down')return{p:-1.1,y:0.3};
  if(mode==='rush'&&r){
    if(r.frozen){if(p===r.atk)return{p:0.75,y:-r.dir*0.25};if(p===r.def)return{p:1.1,y:-r.ddir*0.55}}
    if(r.phase==='finish'&&p===r.striker){const d=p.swingDir,u=p.swingT/0.12;return u<1?L(up(d),low(d),ease(u)):L(low(d),G,ease((p.swingT-0.12)/0.12))}
    if(p===r.atk&&p.state!=='hurt'){
      if(r.phase==='atk'){const d=curDir(p);return L({p:1.0,y:-d*0.4},up(d),ease(r.t/RUSH_PICK))}
      if(r.phase==='miss')return{p:0.75,y:-r.dir*0.25};
      if(r.phase==='slow'){const u=r.t/r.win;return L(up(r.dir),{p:0.75,y:-r.dir*0.25},u*u)}
      if(r.phase==='gap')return r.t<70?L(up(r.dir),{p:0.55,y:-r.dir*0.3},r.t/70):L({p:0.55,y:-r.dir*0.3},{p:1.0,y:0},(r.t-70)/130);
      if(r.phase==='fail')return L({p:0.6,y:0},low(r.dir),ease(r.t/120));
    }
    if(p===r.def&&r.phase==='atk')return G;
    if(p===r.def&&r.phase==='miss')return{p:1.1,y:-r.ddir*0.55};
    if(p===r.def&&r.phase==='slow'){const d=curDir(p);return L(G,{p:1.1,y:-d*0.55},ease(Math.min(1,r.t/250)))}
    if(p===r.def&&r.phase==='gap'){const d=r.ddir;return r.t<70?L(up(d),{p:0.55,y:-d*0.3},r.t/70):L({p:0.55,y:-d*0.3},{p:1.0,y:0},(r.t-70)/130)}
  }
  switch(p.state){
    case 'windup':{const u=p.st/WIND,d=p.dir;if(u<0.4)return L(G,up(d),ease(u/0.4));if(u<0.7)return{p:1.95+Math.sin(T*30)*0.03,y:d*0.6};return L(up(d),mid,ease((u-0.7)/0.3))}
    case 'strike':{const t=p.st,d=p.dir,rd=p.recDur||REC;if(t<130)return L(mid,low(d),ease(t/130));if(p.whiff&&t<rd-250)return{p:-0.75+Math.sin(T*9)*0.04,y:-d*0.8};return L(low(d),G,ease((t-Math.max(130,rd-250))/Math.min(rd-130,250)))}
    case 'recoil':return L({p:1.4,y:0},G,ease(p.st/REC));
    case 'kick':return{p:1.3,y:G.y};
    case 'hurt':return L({p:-0.5,y:0.2},G,p.st/Math.min(p.hurtDur,600));
    case 'stagger':return{p:-0.9+Math.sin(T*16)*0.15,y:0.3};
  }
  return{p:G.p+Math.sin(T*2+p.i)*0.03,y:G.y};
}
// 残像: 胸の高さの水平な楕円軌道。手前斬り=奥→手前、奥斬り=手前→奥
function ghostInfo(p){const r=rush;
  if(mode==='rush'&&r){
    if(p===r.atk&&r.phase==='atk'){const h=0.2+0.25*ease(r.t/RUSH_PICK);return{dir:curDir(p),alpha:0.5,h,tail:0}}
    if(p===r.atk&&r.phase==='slow'){const h=0.35+0.6*(r.t/r.win);return{dir:r.dir,alpha:1,h,tail:Math.max(0,h-0.55)}}
    if(p===r.def&&r.phase==='slow')return{dir:curDir(p),alpha:0.45,h:0.3,tail:0};
    if(p===r.atk&&r.phase==='miss')return{dir:r.dir,alpha:1,h:0.95,tail:0.4};
    if(p===r.def&&r.phase==='miss')return{dir:r.ddir,alpha:0.85,h:0.5,tail:0.05};
    if((p===r.atk||p===r.def)&&r.phase==='gap'){const h=Math.min(1,r.t/70);return{dir:p===r.atk?r.dir:r.ddir,alpha:1-r.t/200,h,tail:Math.max(0,h-0.5)}}
    if(r.frozen){if(p===r.atk)return{dir:r.dir,alpha:1,h:0.95,tail:0.4};if(p===r.def)return{dir:r.ddir,alpha:0.85,h:0.5,tail:0.05}}
    if(r.phase==='finish'&&p===r.striker&&p.swingT<0.3){const h=Math.min(1,p.swingT/0.12);return{dir:p.swingDir,alpha:1-p.swingT/0.3,h,tail:Math.max(0,h-0.5)}}
    return null}
  if(p.state==='windup'){const u=p.st/WIND,h=ease(u/0.8);return{dir:p.dir,alpha:0.9,h,tail:Math.max(0,h-0.5)}}
  if(p.state==='strike'&&p.st<220){const u=p.st/220;return{dir:p.dir,alpha:1-u,h:1,tail:0.5+u*0.45}}
  return null}
function drawGhost(g,layer){
  const N=36,a=2.0,pts=[];
  for(let i=0;i<=N;i++){const s=i/N,th=g.dir===TEMAE?lerp(-a,a,s):lerp(a,-a,s);pts.push([66+64*Math.cos(th),114-12*s,80*Math.sin(th)])}
  const i0=Math.floor(g.tail*N),i1=Math.min(N,Math.ceil(g.h*N));if(i1-i0<1)return;
  const back=layer==='back';
  // 連続した区間ごとにリボン状に塗る
  let run=[];const runs=[];
  for(let i=i0;i<=i1;i++){const z=pts[i][2];if((z<0)===back)run.push(i);else{if(run.length>1)runs.push(run);run=[]}}
  if(run.length>1)runs.push(run);
  for(const r of runs){
    const L=[],Rr=[],mid=[];

function hpBar(x,y,w,h,f,g,rev){const sk=h*0.9;

function veil(a){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,HW,FH)}

  ctx.restore();

function drawPinch(p){if(p.pinch<=0&&!(p.pinchHit>0))return;
  const k=1,pulse=0.75+0.25*Math.sin(T*9),fl=p.pinchHit||0;

function drawSlowFx(){const r=rush;if(!r||(r.phase!=='slow'&&r.phase!=='miss'&&!r.frozen))return;const u=r.phase!=='slow'?1:Math.min(1,r.t/120);
  if(r.phase==='miss'&&r.t<120){ctx.fillStyle=`rgba(255,255,255,${0.7*(1-r.t/120)})`;ctx.fillRect(0,0,HW,FH)}

  if(mode==='fight'&&me.newSword>0){ctx.globalAlpha=Math.min(1,me.newSword);txt('替えの刀を抜いた',HW/2,FH*0.14,FH*0.045,'#111','#fff',4);ctx.globalAlpha=1}

  if(mode==='rush'&&rush){const r=rush,isAtk=me===r.atk;
    if(r.phase==='stagger'&&!isAtk){txt('崩れた！',HW/2,FH*0.32,FH*0.07,'#111','#fff',6)}

    else if(r.phase!=='stagger'){

      if(!(r.broke&&(r.phase==='finish'||r.phase==='after')))txt(isAtk?'連撃を浴びせよ！':'防御し続けろ！',HW/2,FH*0.14,FH*0.05,'#111','#fff',5);
      txt('蓄積 '+r.pot,HW/2,FH*0.2,FH*0.032,'#333','#fff',3);
      {if(r.phase==='atk'&&isAtk)txt('角度を決めろ！',HW/2,FH*0.26,FH*0.048,'#111','#fff',4);

       if((r.phase==='miss'||r.frozen)&&!isAtk){const z=r.phase==='miss'?1+Math.max(0,1-r.t/160)*0.6:1;txt('しまった！',HW/2,FH*0.42,FH*0.11*z,'#fff','#000',7)}
       if((r.phase==='miss'||r.frozen)&&isAtk){const z=r.phase==='miss'?1+Math.max(0,1-r.t/160)*0.6:1;txt('勝った！',HW/2,FH*0.42,FH*0.11*z,'#111','#fff',7)}
       if(r.phase==='slow'&&!isAtk)txt('相手の角度に合わせろ！',HW/2,FH*0.26,FH*0.048,'#fff','#000',4);}

      if((r.phase==='finish'||r.phase==='after')&&r.broke&&!isAtk)txt('守り抜いた！',HW/2,FH*0.42,FH*0.1,'#111','#fff',7);
    }}
  if((mode==='ko'&&modeT>0.7)||mode==='end'){const win=koWinner===me,a=Math.min(1,(mode==='end'?1:(modeT-0.7)/0.4));

function renderView(v){

  drawSky(camX);if(mode==='rush')drawSlowFx();drawSamurai(P[1-v],s);drawSamurai(P[v],s);drawParts(s);
  grass(camX,1.25,FH+6,10,6,30,'#1c1c1c',9);drawLeaves();
  ctx.restore();
  ctx.fillStyle='#1c1c1c';ctx.fillRect(0,FH,HW,HH-FH+2);grass(camX,1.25,FH+6,10,6,30,'#1c1c1c',9);

// ===== 同期 (ホストが計算し、状態と演出イベントをゲストへ送る) =====
const PKEYS=['x','hp','hpG','lever','lastDir','lean','leanV','state','st','dir','pinch','pinchHit','lunge','walk','moving','swingT','swingDir','whiff','recDur','hurtDur','kickA','btnFlash','newSword','ready','broken','dur','kdone'];
const RREF=['atk','def','striker','victim'];
let EVQ=[],emitDepth=0;
function emitWrap(get,set,tag,mapA){const f=get();set(function(...a){if(NET&&NET.role==='host'&&emitDepth===0)EVQ.push([tag,mapA?mapA(a):a]);emitDepth++;try{return f.apply(this,a)}finally{emitDepth--}})}
for(const k of Object.keys(sfx))if(typeof sfx[k]==='function')emitWrap(()=>sfx[k],f=>sfx[k]=f,'s:'+k);
const pi=a=>[a[0]&&a[0].i!==undefined?a[0].i:a[0]];
emitWrap(()=>spawnSpark,f=>spawnSpark=f,'spark');
emitWrap(()=>spawnInk,f=>spawnInk=f,'ink',pi);
emitWrap(()=>spawnSlash,f=>spawnSlash=f,'slash',pi);
emitWrap(()=>spawnShards,f=>spawnShards=f,'shards',pi);
emitWrap(()=>buzz,f=>buzz=f,'buzz');
emitWrap(()=>bgmDuck,f=>bgmDuck=f,'duck');
function snapshot(){let r=null;if(rush){r={};for(const k in rush){const v=rush[k];r[k]=RREF.includes(k)?(v?v.i:-1):v}}
  return{m:mode,mt:modeT,cm:camMid,sh:shake,kw:koWinner?koWinner.i:-1,P:P.map(p=>PKEYS.map(k=>p[k])),r}}
function applySnap(s){mode=s.m;modeT=s.mt;camMid=s.cm;shake=s.sh;koWinner=s.kw>=0?P[s.kw]:null;
  s.P.forEach((arr,i)=>PKEYS.forEach((k,j)=>P[i][k]=arr[j]));
  if(s.r){const r={};for(const k in s.r){const v=s.r[k];r[k]=RREF.includes(k)?(v>=0?P[v]:undefined):v}rush=r}else rush=null}
function replay(ev){for(const [tag,a] of ev){
  if(tag.startsWith('s:')){const f=sfx[tag.slice(2)];if(f)f.apply(sfx,a)}
  else if(tag==='spark')spawnSpark(...a);else if(tag==='ink')spawnInk(P[a[0]]);else if(tag==='slash')spawnSlash(P[a[0]]);
  else if(tag==='shards')spawnShards(P[a[0]]);else if(tag==='buzz')buzz(...a);else if(tag==='duck')bgmDuck(...a)}}

// ===== 1人1画面のレイアウト =====
let VK=1,VX=0,VYo=0;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  GW=540;GH=1170;OX=0;HW=540;HH=585;FH=HH*0.72;GY=FH*0.86;sc=FH*0.5/165;
  R=Math.min(HW*0.12,(HH-FH)*0.34);LX=HW*0.2;AX=HW*0.8;LY=FH+(HH-FH)*0.5;
  VK=Math.min(W/HW,H/HH);VX=(W-HW*VK)/2;VYo=(H-HH*VK)/2}
addEventListener('resize',resize);resize();
function render(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#0d0d0d';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.setTransform(DPR*VK,0,0,DPR*VK,DPR*VX,DPR*VYo);ctx.beginPath();ctx.rect(0,0,HW,HH);ctx.clip();renderView(ME);ctx.restore()}

// ===== ループ =====
let last=performance.now(),latest=null,lastSent=null,sendT=0,netLost=false;
function frame(now){let dt=Math.min(0.05,(now-last)/1000);last=now;readLocalLever();
  if(NET&&NET.role==='host'){
    P[0].lever=localLever;P[1].lever=remoteLever;
    if(hitStop>0){hitStop-=dt;dt*=0.05}if(slow>0){slow-=dt;dt*=0.35}
    update(dt);
    if(NET.open){NET.send({s:snapshot(),e:EVQ});EVQ=[]}
  }else if(NET&&NET.role==='guest'){
    if(localLever!==lastSent||(now-sendT)>250){NET.send({l:localLever});lastSent=localLever;sendT=now}
    if(latest){applySnap(latest.s);replay(latest.e||[]);latest.e=[]}
    // 見た目だけの時間(葉・火花など)は手元で進める
    const sl=(mode==='rush'&&rush)?(rush.phase==='slow'?0.2:(rush.phase==='miss'||rush.frozen)?0:1):1;
    T+=dt*sl;updLeaves(dt*sl);
    for(const q of parts){q.age+=dt;q.wx+=(q.vx||0)*dt;q.h+=(q.vy||0)*dt;if(q.g)q.vy-=q.g*dt;if(q.va)q.ang+=q.va*dt}
    parts=parts.filter(q=>q.age<q.life);
  }else{T+=dt;updLeaves(dt)}
  render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);

// ===== ロビー (部屋づくり・招待リンク) =====
const $=id=>document.getElementById(id);
const PREFIX='fuuraizan3d-';
function lobby(html){$('lobby').style.display='flex';$('lobbyBody').innerHTML=html}
function hideLobby(){$('lobby').style.display='none'}
function lost(msg){netLost=true;lobby(`<p class="big">${msg}</p><button onclick="location.href=location.pathname">ロビーに戻る</button>`)}
function randCode(){const c='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
// 通信路: 本番はPeerJS(WebRTC)。?local=1 なら同じブラウザのタブ同士(BroadcastChannel)で試せる
const params=new URLSearchParams(location.search),ROOM=(params.get('room')||'').toLowerCase().replace(/[^a-z0-9]/g,''),LOCAL=params.get('local')==='1';
function wire(role,sendRaw,onReady){NET={role,open:true,send:o=>{try{sendRaw(o)}catch(e){}}};ME=role==='host'?0:1;
  reset();if(role==='host'){mode='title'}hideLobby();onReady&&onReady()}
function onMsg(o){if(!NET)return;
  if(NET.role==='host'){if(o.l!==undefined)remoteLever=clamp(+o.l||0,-1,1);if(o.a)act(P[1])}
  else if(o.s)latest={s:o.s,e:(latest&&latest.e&&latest.e.length?latest.e.concat(o.e||[]):(o.e||[]))}}
function startHost(){const code=randCode(),url=location.origin+location.pathname+'?room='+code+(LOCAL?'&local=1':'');
  lobby(`<p>部屋を作りました。このリンクを友達に送ってください</p>
    <div class="row"><input id="inv" readonly value="${url}"><button id="cp">コピー</button></div>
    <p class="dim">相手の接続を待っています…</p>`);
  $('cp').onclick=()=>{const i=$('inv');i.select();try{navigator.clipboard.writeText(i.value).then(()=>$('cp').textContent='コピーしました')}catch(e){document.execCommand('copy');$('cp').textContent='コピーしました'}};
  if(LOCAL){const bc=new BroadcastChannel(PREFIX+code);bc.onmessage=ev=>{const o=ev.data;if(o.hello&&!NET){wire('host',x=>bc.postMessage(x));bc.postMessage({welcome:1})}else onMsg(o)};return}
  const peer=new Peer(PREFIX+code);
  peer.on('error',e=>lost(e.type==='unavailable-id'?'部屋番号が重なりました。もう一度作ってください':'接続エラー：'+(e.type||e)));
  peer.on('connection',conn=>{if(NET){conn.close();return}
    conn.on('open',()=>{wire('host',o=>conn.send(o))});conn.on('data',onMsg);
    conn.on('close',()=>{if(!netLost)lost('相手との接続が切れました')})})}
function startGuest(){lobby(`<p class="big">部屋「${ROOM}」に接続中…</p>`);
  if(LOCAL){const bc=new BroadcastChannel(PREFIX+ROOM);bc.onmessage=ev=>{const o=ev.data;if(o.welcome&&!NET)wire('guest',x=>bc.postMessage(x));else onMsg(o)};
    const hi=setInterval(()=>{if(NET)clearInterval(hi);else bc.postMessage({hello:1})},300);return}
  const peer=new Peer();
  peer.on('error',e=>lost(e.type==='peer-unavailable'?'部屋が見つかりません。リンクが古いか、ホストが閉じています':'接続エラー：'+(e.type||e)));
  peer.on('open',()=>{const conn=peer.connect(PREFIX+ROOM,{reliable:true});
    conn.on('open',()=>wire('guest',o=>conn.send(o)));conn.on('data',onMsg);
    conn.on('close',()=>{if(!netLost)lost('ホストとの接続が切れました')})})}
function boot(){if(!LOCAL&&typeof Peer==='undefined'){lobby('<p class="big">通信ライブラリを読み込めませんでした</p><p class="dim">ネット接続を確認して再読み込みしてください</p>');return}
  if(ROOM)startGuest();
  else lobby(`<h1>風来斬<span>3D</span></h1><p class="dim">オンライン対戦</p><button id="mk">部屋を作る</button>
    <p class="dim small">作ると招待リンクが出ます。友達はそのリンクを開くだけで参加できます</p>`),$('mk').onclick=()=>{initAudio();startHost()}}
addEventListener('load',boot);
</script>
